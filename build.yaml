# This file generates the GitHub Actions matrix.
# Only the images that actually get flashed are built.
# Studio only runs on the central (left) half, so the right half doesn't get the snippet.
include:
  - board: nice_nano_v2
    shield: corneroe_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corneroe_left_with_studio
  - board: nice_nano_v2
    shield: corneroe_right nice_oled
    artifact-name: corneroe_right
  - board: nice_nano_v2
    shield: settings_reset
