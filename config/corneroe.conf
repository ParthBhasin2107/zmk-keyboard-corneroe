# Uncomment to enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
# Screens switch off when the keyboard goes idle (see ZMK_IDLE_TIMEOUT below)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

## Display Widgets
#CONFIG_ZMK_WIDGET_WPM_STATUS=y
#CONFIG_ZMK_WIDGET_LAYER_STATUS=y
#CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
#CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
#CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# zmk studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# add mouse emu
CONFIG_ZMK_POINTING=y
# High-res scrolling (HID Resolution Multiplier). Hosts that honour it get 1/16-notch steps.
# Changing this changes the HID descriptor: remove + re-pair the keyboard on each host after flashing.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

### Power
# Idle (screens off) after 5 min without input. Deep sleep after 1h; any key wakes it.
# ZMK never sleeps while USB is powering the board, so a wired left half stays awake.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_EXT_POWER=y

### Improves compatibility with iPad
# ref: https://zmk.dev/docs/config/system#hid
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

### Bluetooth latency / stability
# 2M PHY is known to cause lag/drops with Intel & Realtek adapters on Windows (ZMK troubleshooting docs).
# EXPERIMENTAL_CONN also defaults it off; set explicitly so it can't be re-enabled by accident.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Max TX power: stronger link to the host and between halves, negligible battery cost.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

### DEBUG OPTIONS
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

