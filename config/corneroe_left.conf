# Left (central) OLED: typing-speed gauge and graph instead of the bongo cat.
# These symbols only exist on the central, so they live here rather than in corneroe.conf.
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
# nice_oled only draws the graph when the fixed modifier indicators are off (they share its spot).
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=n
